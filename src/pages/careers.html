
<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="{{R}}index.html">Home</a> / Work with us</p>
    <h1>Build NextGR <span class="grad-text">with us.</span></h1>
    <p class="lead">We hire the people we serve. Remote roles for students and young professionals — paid, commission-based and volunteer — with real responsibility and a portfolio to show for it.</p>
  </div>
</section>
<section style="padding-top:10px">
  <div class="container"><div class="grid g3" data-roles></div></div>
</section>
<section class="alt" id="apply">
  <div class="container narrow">
    <div class="form-card">
      <h2>Apply</h2>
      <form data-lead-form="team-application" novalidate data-success="Application received! We reply to every applicant within 7 days.">
        <div class="field"><label for="roleSelect">Role</label><select id="roleSelect" name="role" required><option value="">Choose a role…</option></select></div>
        <div class="row2"><div class="field"><label for="rName">Full name</label><input id="rName" name="name" required></div><div class="field"><label for="rEmail">Email</label><input id="rEmail" type="email" name="email" required></div></div>
        <div class="row2"><div class="field"><label for="rLoc">City, country</label><input id="rLoc" name="location" required></div><div class="field"><label for="rHrs">Hours per week</label><select id="rHrs" name="hours"><option>Under 5</option><option>5–10</option><option>10–20</option><option>20+</option></select></div></div>
        <div class="field"><label for="rLink">Portfolio / LinkedIn / GitHub</label><input id="rLink" name="portfolio" type="url" placeholder="https://"></div>
        <div class="field"><label for="rWhy">Why you, in 3 sentences</label><textarea id="rWhy" name="why" required></textarea></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Send application</button>
      </form>
    </div>
  </div>
</section>
